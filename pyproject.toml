[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hitodama"
version = "0.1.0"
description = "Hitodama: a voice-first AI companion for Windows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "keyring>=25.0",
    "google-genai>=2.30",
    "sounddevice>=0.5",
    "pynput>=1.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
]

[project.scripts]
hitodama = "hitodama.main:run"

[tool.hatch.build.targets.wheel]
packages = ["hitodama"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hitodama", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qasync", "qasync.*", "sounddevice", "pynput", "pynput.*", "win32event", "win32api", "winerror", "pytestqt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-assistant"
version = "0.2.0"
description = "JARVIS: a voice assistant and safe desktop agent for Windows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.10",
    "qasync>=0.27",
    "pydantic>=2.12",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "httpx>=0.27",
    "psutil>=5.9",
    "sounddevice>=0.5",
    "pynput>=1.8",
    "pywin32>=311; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "pycaw>=20240316; sys_platform == 'win32'",
    "pypdf>=5.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1",  # the writing assistant's Word files (MIT)
    "tzdata>=2024.1; sys_platform == 'win32'",  # time zones for calendar feeds
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    # JARVIS's own voice (Kokoro model run locally; see jarvis/voice/neural.py)
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "phonemizer>=3.3",
    "espeakng-loader>=0.2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
]

[project.scripts]
jarvis = "jarvis.main:run"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
artifacts = ["jarvis/assets/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jarvis", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qasync", "qasync.*", "sounddevice", "pynput", "pynput.*", "win32event", "win32api", "win32clipboard", "uiautomation", "pycaw", "pycaw.*", "comtypes", "pypdf", "winrt", "winrt.*", "onnxruntime", "phonemizer", "phonemizer.*", "espeakng_loader", "winerror", "win32com", "win32com.*", "pythoncom", "psutil", "pytestqt.*", "win32evtlog", "win32cred", "docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"
